<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bright Maths Start</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-container">
    <header class="main-header">
      <div class="logo-badge">⭐ Bright Maths Start</div>
      <p class="tagline">Interactive Column Practice (1 to 6 Digits)</p>
    </header>

    <!-- DIGIT & OPERATION SELECTION GRID -->
    <div class="button-grid">
      <!-- Addition Row (Red) -->
      <button class="grid-btn btn-add" onclick="selectMode('add', 1)">+ 1-Digit</button>
      <button class="grid-btn btn-add" onclick="selectMode('add', 2)">+ 2-Digit</button>
      <button class="grid-btn btn-add" onclick="selectMode('add', 3)">+ 3-Digit</button>
      <button class="grid-btn btn-add" onclick="selectMode('add', 4)">+ 4-Digit</button>
      <button class="grid-btn btn-add" onclick="selectMode('add', 5)">+ 5-Digit</button>
      <button class="grid-btn btn-add" onclick="selectMode('add', 6)">+ 6-Digit</button>

      <!-- Subtraction Row (Orange) -->
      <button class="grid-btn btn-sub" onclick="selectMode('sub', 1)">- 1-Digit</button>
      <button class="grid-btn btn-sub" onclick="selectMode('sub', 2)">- 2-Digit</button>
      <button class="grid-btn btn-sub" onclick="selectMode('sub', 3)">- 3-Digit</button>
      <button class="grid-btn btn-sub" onclick="selectMode('sub', 4)">- 4-Digit</button>
      <button class="grid-btn btn-sub" onclick="selectMode('sub', 5)">- 5-Digit</button>
      <button class="grid-btn btn-sub" onclick="selectMode('sub', 6)">- 6-Digit</button>

      <!-- Multiplication Row (Blue) -->
      <button class="grid-btn btn-mult" onclick="selectMode('mult', 1)">× 1-Digit</button>
      <button class="grid-btn btn-mult" onclick="selectMode('mult', 2)">× 2-Digit</button>
      <button class="grid-btn btn-mult" onclick="selectMode('mult', 3)">× 3-Digit</button>
      <button class="grid-btn btn-mult" onclick="selectMode('mult', 4)">× 4-Digit</button>
      <button class="grid-btn btn-mult" onclick="selectMode('mult', 5)">× 5-Digit</button>
      <button class="grid-btn btn-mult" onclick="selectMode('mult', 6)">× 6-Digit</button>

      <!-- Division Row (Green) -->
      <button class="grid-btn btn-div" onclick="selectMode('div', 1)">÷ 1-Digit</button>
      <button class="grid-btn btn-div" onclick="selectMode('div', 2)">÷ 2-Digit</button>
      <button class="grid-btn btn-div" onclick="selectMode('div', 3)">÷ 3-Digit</button>
      <button class="grid-btn btn-div" onclick="selectMode('div', 4)">÷ 4-Digit</button>
      <button class="grid-btn btn-div" onclick="selectMode('div', 5)">÷ 5-Digit</button>
      <button class="grid-btn btn-div" onclick="selectMode('div', 6)">÷ 6-Digit</button>
    </div>

    <!-- COLUMN MATH DISPLAY BOARD -->
    <main class="board-card">
      <div id="column-board" class="column-board">
        <!-- Dynamic Place Value Headers, Carry Boxes, Problem & Digit Input Boxes -->
      </div>

      <div class="action-bar">
        <button class="btn-check" onclick="checkAnswer()">Check Answer</button>
        <button class="btn-next" onclick="generateProblem()">Next Problem</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="score-board">
        <div class="stat-box">⭐ Score: <strong id="score">0</strong></div>
        <div class="stat-box">🔥 Streak: <strong id="streak">0</strong></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
